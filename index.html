<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Condo Plan</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:DM Mono,monospace;background:#0d1117;color:#e6edf3;min-height:100vh}
.app{max-width:1002px;margin:0 auto;background:#111827;min-height:100vh}
.hdr{position:sticky;top:0;z-index:100;background:#020617;border-bottom:1px solid #30363d;padding:12px 16px;display:flex;align-items:center;gap:10px}
.hdr h1{font-family:Syne,sans-serif;font-size:18px;font-weight:800;color:#58a6ff;margin-right:auto}
.hb{border:1px solid #30363d;border-radius:8px;padding:8px 14px;font-family:DM Mono,monospace;font-size:12px;cursor:pointer;background:#1c2333;color:#e6edf3}.hb:active{opacity:.7}
.panel{padding:12px 16px;border-bottom:1px solid #30363d}
select{border:1px solid #30363d;border-radius:8px;padding:8px 10px;background:#161b22;color:#e6edf3;font-family:DM Mono,monospace;font-size:12px;width:100%}
.st{font-size:12px;color:#58a6ff;margin-top:8px}.sw{padding:12px 16px;overflow:hidden}
#stagewrap{width:100%;overflow:hidden}
#stage{position:relative;width:1002px;display:inline-block;background:#1e293b;border-radius:12px;overflow:hidden;transform-origin:top left}
#stage img{width:100%;height:auto;display:block}
#layer{position:absolute;top:0;left:0;width:100%;height:100%;container-type:inline-size}
.obj{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:500;cursor:pointer;user-select:none;overflow:visible}
.zone,.box{border-radius:12px}.pill{border-radius:999px;padding:6px 14px}
.dot,.photo,.note,.num{border-radius:50%}.callout{border-radius:10px;padding:6px 10px}
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;align-items:flex-end;justify-content:center}
.mbg.on{display:flex}
.mo{width:100%;max-width:600px;background:#161b22;border:1px solid #30363d;border-radius:20px 20px 0 0;overflow:hidden;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:16px 20px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.mh-title{font-family:Syne,sans-serif;font-size:18px;font-weight:800;color:#58a6ff}
.mh-close{background:#1c2333;border:1px solid #30363d;border-radius:8px;padding:7px 14px;color:#e6edf3;cursor:pointer;font-size:13px;font-family:DM Mono,monospace}
.mb{padding:16px 20px;overflow-y:auto;flex:1}
.syncbar{padding:8px 20px;background:#0a1f12;border-top:1px solid #1a3a24;font-size:11px;color:#3fb950;display:flex;align-items:center;gap:8px;flex-shrink:0}
.sdot{width:7px;height:7px;border-radius:50%;background:#3fb950;flex-shrink:0;transition:background .2s}.sdot.saving{background:#d29922}.sdot.error{background:#f85149}
.fcard{border:1px solid #30363d;border-radius:12px;padding:14px;margin-bottom:12px;background:#0d1117}
.fcard-lbl{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.fcard-icon{font-size:15px}.fcard-req{color:#f85149}
.finput{width:100%;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 12px;color:#e6edf3;font-family:DM Mono,monospace;font-size:15px;outline:none;transition:border-color .15s}
.finput:focus{border-color:#58a6ff}textarea.finput{min-height:90px;resize:vertical}
.funit{font-size:11px;color:#58a6ff;margin-top:5px}
.cam-btn{width:100%;background:#1c2333;border:2px dashed #30363d;border-radius:10px;padding:14px;color:#8b949e;font-family:DM Mono,monospace;font-size:13px;cursor:pointer;text-align:center;margin-top:6px}.cam-btn:active{opacity:.7}.uploading{color:#d29922;border-color:#d29922;pointer-events:none}
/* gallery grid */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.gallery-item{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:#161b22;border:1px solid #30363d}
.gallery-item img{width:100%;height:100%;object-fit:cover;display:block}
.gallery-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);border:0;border-radius:6px;color:#f85149;font-size:14px;width:24px;height:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.flink{color:#58a6ff;word-break:break-all;font-size:13px;display:block;margin-top:6px;text-decoration:none}.flink:hover{text-decoration:underline}
#offbar{display:none;background:#7a3a00;color:#fbbf24;font-size:12px;text-align:center;padding:7px;position:sticky;top:52px;z-index:99}#offbar.on{display:block}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#161b22;border:1px solid #30363d;border-radius:10px;padding:10px 20px;font-size:12px;color:#8b949e;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}#toast.on{opacity:1}
</style></head><body>

  G("mb").innerHTML='<div style="color:#484f58;padding:12px 0">Chargement...</div>';
  G("mbg").classList.add("on");sync("ok","Synchronisé");

function buildModal(o,saved){
  var mb=G("mb");mb.innerHTML="";
  o.fields.forEach(function(f){
    var ui=f.ui||{};
    var isGallery=(f.type==="gallery");
    var isNote=(f.type==="note"||ui.multiline);
    var card=document.createElement("div");card.className="fcard";
    card.style.borderColor=(ui.accent||"#58a6ff")+"44";
    var lbl=document.createElement("div");lbl.className="fcard-lbl";
    if(ui.icon)lbl.innerHTML='<span class="fcard-icon">'+esc(ui.icon)+'</span>';
    lbl.innerHTML+='<span>'+esc(f.label||"Champ")+'</span>';
    card.appendChild(lbl);
    if(isGallery){
      // Gallery field — unlimited photos
      var galleryPath="condo/"+cid+"/"+o.id+"/gallery_"+f.id;
      var fi=document.createElement("input");fi.type="file";fi.accept="image/*";fi.capture="environment";fi.style.display="none";
      card.appendChild(fi);
      var addBtn=document.createElement("button");addBtn.className="cam-btn";addBtn.textContent="📷 Ajouter une photo";
      addBtn.onclick=function(){fi.click();};
      card.appendChild(addBtn);
      var grid=document.createElement("div");grid.className="gallery-grid";
      card.appendChild(grid);
      // load existing photos from firebase
      get(ref(db,galleryPath)).then(function(snap){
        if(snap.exists()){
          var photos=snap.val();
          Object.keys(photos).forEach(function(key){
            addGalleryThumb(grid,galleryPath,key,photos[key]);
          });
        }
      });
      fi.addEventListener("change",async function(){
        var file=fi.files[0];if(!file)return;
        addBtn.textContent="⏳ Envoi...";addBtn.classList.add("uploading");
        sync("saving","Upload photo...");
        try{
          var url=await uploadPhoto(file);
          var newRef=push(ref(db,galleryPath));
          await set(newRef,url);
          addGalleryThumb(grid,galleryPath,newRef.key,url);
          addBtn.textContent="📷 Ajouter une photo";addBtn.classList.remove("uploading");
          sync("ok","Synchronisé ✓");toast("Photo ajoutée ✓");
        }catch(e){
          addBtn.textContent="❌ Erreur — réessayer";addBtn.classList.remove("uploading");
          sync("error","Erreur upload");
        }
        fi.value="";
      });
    } else {
      var sv=saved[f.id];var val=(sv!=null&&sv!=="")? sv:(f.value||"");
      var inp;
      if(isNote){inp=document.createElement("textarea");inp.className="finput";inp.value=val;inp.placeholder=ui.placeholder||"";}
      else if(f.type==="checkbox"){inp=document.createElement("select");inp.className="finput";inp.innerHTML='<option value="">—</option><option value="oui"'+( val==="oui"?" selected":"")+'>Oui</option><option value="non"'+( val==="non"?" selected":"")+'>Non</option>';}
      else{inp=document.createElement("input");inp.className="finput";inp.value=val;inp.placeholder=ui.placeholder||"";if(f.type==="number"||f.type==="dimension")inp.inputMode="decimal";}
      card.appendChild(inp);
      if(ui.unit){var u=document.createElement("div");u.className="funit";u.textContent=ui.unit;card.appendChild(u);}
      (function(field,input){var dbt=null;function doSave(){var v=input.value||"";field.value=v;saveField(cid,o.id,field.id,v);}input.addEventListener("input",function(){sync("saving","Frappe...");clearTimeout(dbt);dbt=setTimeout(doSave,800);});input.addEventListener("change",doSave);input.addEventListener("blur",function(){clearTimeout(dbt);doSave();});})(f,inp);
    }
    mb.appendChild(card);
  });
}
function addGalleryThumb(grid,galleryPath,key,url){

img.style.cursor="pointer";
img.onclick=function(){

  var pic=document.createElement("img");

  pic.style.cssText="max-width:100%;max-height:100%;border-radius:10px;object-fit:contain";
  lb.appendChild(pic);
  lb.onclick=function(){lb.remove();};
  document.body.appendChild(lb);
};
  var del=document.createElement("button");del.className="gallery-del";del.textContent="✕";

}
