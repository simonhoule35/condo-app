<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Condo Plan</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:DM Mono,monospace;background:#0d1117;color:#e6edf3;min-height:100vh}
.app{max-width:1002px;margin:0 auto;background:#111827;min-height:100vh}
.hdr{position:sticky;top:0;z-index:100;background:#020617;border-bottom:1px solid #30363d;padding:12px 16px;display:flex;align-items:center;gap:10px}
.hdr h1{font-family:Syne,sans-serif;font-size:18px;font-weight:800;color:#58a6ff;margin-right:auto}
.hb{border:1px solid #30363d;border-radius:8px;padding:8px 14px;font-family:DM Mono,monospace;font-size:12px;cursor:pointer;background:#1c2333;color:#e6edf3}
.hb:active{opacity:.7}
.panel{padding:12px 16px;border-bottom:1px solid #30363d}
select{border:1px solid #30363d;border-radius:8px;padding:8px 10px;background:#161b22;color:#e6edf3;font-family:DM Mono,monospace;font-size:12px;width:100%}
.st{font-size:12px;color:#58a6ff;margin-top:8px}
.sw{padding:12px 16px;overflow:hidden}
#stagewrap{width:100%;overflow:hidden}
#stage{position:relative;width:1002px;display:inline-block;background:#1e293b;border-radius:12px;overflow:hidden;transform-origin:top left}
#stage img{width:100%;height:auto;display:block}
#layer{position:absolute;top:0;left:0;width:100%;height:100%;container-type:inline-size}
.obj{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:500;cursor:pointer;user-select:none}
.zone,.box{border-radius:12px}.pill{border-radius:999px;padding:6px 14px}
.dot,.photo,.note,.num{border-radius:50%}.callout{border-radius:10px;padding:6px 10px}
.line,.dash,.arrow,.darrow{transform-origin:left center;padding:0}
.dash{background:transparent!important}
.arrow::after,.darrow::after{content:'';position:absolute;right:-1px;top:50%;transform:translateY(-50%);width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid currentColor}
.darrow::before{content:'';position:absolute;left:-1px;top:50%;transform:translateY(-50%) rotate(180deg);width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid currentColor}

/* MODAL — slides up from bottom on mobile */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;align-items:flex-end;justify-content:center}
.mbg.on{display:flex}
.mo{width:100%;max-width:600px;background:#161b22;border:1px solid #30363d;border-radius:20px 20px 0 0;overflow:hidden;max-height:88vh;display:flex;flex-direction:column}
.mh{padding:16px 20px;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.mh-title{font-family:Syne,sans-serif;font-size:18px;font-weight:800;color:#58a6ff}
.mh-close{background:#1c2333;border:1px solid #30363d;border-radius:8px;padding:7px 14px;color:#e6edf3;cursor:pointer;font-size:13px;font-family:DM Mono,monospace}
.mb{padding:16px 20px;overflow-y:auto;flex:1}
.syncbar{padding:8px 20px;background:#0a1f12;border-top:1px solid #1a3a24;font-size:11px;color:#3fb950;display:flex;align-items:center;gap:8px;flex-shrink:0}
.sdot{width:7px;height:7px;border-radius:50%;background:#3fb950;flex-shrink:0;transition:background .2s}
.sdot.saving{background:#d29922}
.sdot.error{background:#f85149}

/* FIELD CARDS */
.fcard{border:1px solid #30363d;border-radius:12px;padding:14px;margin-bottom:12px;background:#0d1117}
.fcard-lbl{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.fcard-icon{font-size:15px}
.fcard-req{color:#f85149}
.finput{width:100%;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 12px;color:#e6edf3;font-family:DM Mono,monospace;font-size:15px;outline:none;transition:border-color .15s}
.finput:focus{border-color:#58a6ff}
textarea.finput{min-height:90px;resize:vertical}
.funit{font-size:11px;color:#58a6ff;margin-top:5px}
.fphoto{display:block;max-width:100%;max-height:220px;border-radius:10px;border:1px solid #30363d;margin-top:8px}
.flink{color:#58a6ff;word-break:break-all;font-size:13px;display:block;margin-top:6px;text-decoration:none}
.flink:hover{text-decoration:underline}
.fempty{color:#484f58;font-style:italic;font-size:13px;padding:4px 0}

/* OFFLINE BAR */
#offbar{display:none;background:#7a3a00;color:#fbbf24;font-size:12px;text-align:center;padding:7px;position:sticky;top:52px;z-index:99;letter-spacing:.3px}
#offbar.on{display:block}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#161b22;border:1px solid #30363d;border-radius:10px;padding:10px 20px;font-size:12px;color:#8b949e;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
</style></head><body>
<div class="app">
  <div class="hdr"><h1 id="ptitle">Condo</h1><button class="hb" id="backbtn" style="display:none">← Main</button></div>
  <div id="offbar">⚠️ Hors ligne — les changements seront synchronisés à la reconnexion</div>
  <div class="panel"><select id="psel"></select><div class="st" id="st"></div></div>
  <div class="sw"><div id="stagewrap"><div id="stage"><img id="pimg" src=""><div id="layer"></div></div></div></div>
</div>

<div class="mbg" id="mbg">
  <div class="mo">
    <div class="mh">
      <span class="mh-title" id="mt"></span>
      <button class="mh-close" id="mclose">✕ Fermer</button>
    </div>
    <div class="mb" id="mb"></div>
    <div class="syncbar" id="syncbar">
      <div class="sdot" id="sdot"></div>
      <span id="slbl">Synchronisé</span>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD2knNbFuEW-m5pXcAJK7Hpdl9ebmkJW10",
  authDomain: "condo-app-56391.firebaseapp.com",
  databaseURL: "https://condo-app-56391-default-rtdb.firebaseio.com",
  projectId: "condo-app-56391",
  storageBucket: "condo-app-56391.firebasestorage.app",
  messagingSenderId: "228389808496",
  appId: "1:228389808496:web:39a07f52251b2df1b107b5"
};

const fbapp = initializeApp(firebaseConfig);
const db = getDatabase(fbapp);

// ── YOUR LAYOUT DATA ─────────────────────────────────────────────────────────
var D={"pages":[{"id":"main","name":"Main plan","image":"images/main.png","objects":[{"id":"obj_1","label":"Chambre","type":"zone","targetPage":"chambre","left":"10.326%","top":"22.830%","width":"32.517%","height":"31.452%","locked":false,"hidden":false,"style":{"fill":"#08770a","text":"#000000","border":"#116600","opacity":1,"font":3.5,"radius":10,"rotate":0,"z":1,"ff":"inherit"},"fields":[]},{"id":"obj_3","label":"Balcon","type":"zone","targetPage":"balcon","left":"38.880%","top":"7.775%","width":"34.324%","height":"15.912%","locked":false,"hidden":false,"style":{"fill":"#2563eb","text":"#000000","border":"#60a5fa","opacity":1,"font":3.5,"radius":10,"rotate":0,"z":3,"ff":"inherit"},"fields":[]},{"id":"obj_4","label":"Salon","type":"zone","targetPage":"salon","left":"41.799%","top":"23.382%","width":"30.310%","height":"24.313%","locked":false,"hidden":false,"style":{"fill":"#ff6600","text":"#000000","border":"#862809","opacity":1,"font":3.5,"radius":10,"rotate":0,"z":3,"ff":"inherit"},"fields":[]},{"id":"obj_5","label":"Salle à manger","type":"zone","targetPage":"sam","left":"42.657%","top":"46.126%","width":"28.409%","height":"18.344%","locked":false,"hidden":false,"style":{"fill":"#8b5cf6","text":"#000000","border":"#8b5cf6","opacity":1,"font":3,"radius":10,"rotate":0,"z":4,"ff":"inherit"},"fields":[]},{"id":"obj_6","label":"Salle de bain","type":"zone","targetPage":"sb","left":"12.150%","top":"47.901%","width":"30.019%","height":"20.061%","locked":false,"hidden":false,"style":{"fill":"#ff3d3d","text":"#000000","border":"#61d7ff","opacity":1,"font":3,"radius":10,"rotate":0,"z":5,"ff":"inherit"},"fields":[]},{"id":"obj_7","label":"Cuisine","type":"zone","targetPage":"cuisine","left":"44.605%","top":"64.069%","width":"46.097%","height":"27.785%","locked":false,"hidden":false,"style":{"fill":"#ffdd80","text":"#000000","border":"#948000","opacity":1,"font":3.3,"radius":10,"rotate":0,"z":6,"ff":"inherit"},"fields":[]},{"id":"obj_8","label":"A1","type":"pill","targetPage":"chambre","left":"16.499%","top":"24.625%","width":"3.333%","height":"2.375%","locked":false,"hidden":false,"style":{"fill":"#2563eb","text":"#ffffff","border":"#60a5fa","opacity":1,"font":1.5,"ff":"inherit","radius":999,"rotate":0,"z":7},"fields":[{"id":"obj_9","label":"Largeur","type":"dimension","value":"","ui":{"icon":"↔","unit":"po","placeholder":"ex: 36 po"}},{"id":"obj_10","label":"Notes","type":"note","value":"","ui":{"icon":"📝","placeholder":"Observations...","multiline":true}},{"id":"obj_11","label":"Photo","type":"photo","value":"","ui":{"icon":"📷","placeholder":"Coller un lien Google Drive ou URL...","photoMode":"thumbnail"}}]}]},{"id":"chambre","name":"Chambre","image":"images/chambre.png","objects":[]},{"id":"salon","name":"Salon","image":"images/salon.png","objects":[]},{"id":"cuisine","name":"Cuisine","image":"images/cuisine.png","objects":[]},{"id":"sam","name":"Salle à manger","image":"images/s-a-m.png","objects":[]},{"id":"sb","name":"Salle de bain","image":"images/s-b.png","objects":[]},{"id":"balcon","name":"Balcon","image":"images/balcon.png","objects":[]}]};

var cid = D.pages[0].id;
var pending = {};

// ── HELPERS ──────────────────────────────────────────────────────────────────
function G(i){return document.getElementById(i);}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function rgba(hex,a){var c=String(hex||'#2563eb').replace('#','');return'rgba('+parseInt(c.slice(0,2),16)+','+parseInt(c.slice(2,4),16)+','+parseInt(c.slice(4,6),16)+','+a+')';}

function toast(msg){var t=G('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},2000);}

function sync(state, msg){
  var dot=G('sdot'),lbl=G('slbl');
  dot.className='sdot'+(state==='saving'?' saving':state==='error'?' error':'');
  lbl.textContent=msg||'Synchronisé';
}

// ── FIREBASE ─────────────────────────────────────────────────────────────────
function fbPath(pageId, objId, fieldId){
  return 'condo/'+pageId+'/'+objId+'/'+fieldId;
}

function saveField(pageId, objId, fieldId, value){
  sync('saving','Sauvegarde...');
  var path=fbPath(pageId,objId,fieldId);
  set(ref(db, path), value)
    .then(function(){sync('ok','Synchronisé ✓');})
    .catch(function(){
      sync('error','Hors ligne — en attente');
      pending[path]=value;
    });
}

function loadObj(pageId, objId, cb){
  get(ref(db,'condo/'+pageId+'/'+objId))
    .then(function(snap){cb(snap.exists()?snap.val():{});})
    .catch(function(){cb({});});
}

window.addEventListener('online',function(){
  G('offbar').classList.remove('on');
  Object.keys(pending).forEach(function(path){
    set(ref(db,path),pending[path]).then(function(){delete pending[path];});
  });
  toast('Reconnecté — synchronisation...');
});
window.addEventListener('offline',function(){G('offbar').classList.add('on');});

// ── RENDER ───────────────────────────────────────────────────────────────────
function norm(o){
  if(!o.style)o.style={};if(!Array.isArray(o.fields))o.fields=[];
  if(o.style.fontFamily&&!o.style.ff)o.style.ff=o.style.fontFamily;
  o.style.fill=o.style.fill||'#2563eb';o.style.text=o.style.text||'#fff';
  o.style.border=o.style.border||'#60a5fa';
  if(o.style.opacity==null)o.style.opacity=1;if(o.style.font==null)o.style.font=14;
  o.style.ff=o.style.ff||'inherit';if(o.style.radius==null)o.style.radius=10;
  if(o.style.rotate==null)o.style.rotate=0;if(o.style.z==null)o.style.z=1;
  if(!o.width)o.width='20%';if(!o.height)o.height='15%';o.targetPage=o.targetPage||'';
}

function styleEl(el,o){
  if(o.type==='zone'){el.style.background=rgba(o.style.fill,.22);el.style.color=o.style.text;el.style.border='2px solid '+o.style.border;el.style.borderRadius=o.style.radius+'px';el.textContent=o.label;}
  else if(o.type==='pill'){el.style.background=o.style.fill;el.style.color=o.style.text;el.style.border='2px solid '+o.style.border;el.style.borderRadius=o.style.radius+'px';el.textContent=o.label;}
  else if(o.type==='txt'){el.style.color=o.style.text;el.textContent=o.label;}
  else if(o.type==='box'){el.style.background=rgba(o.style.fill,.18);el.style.color=o.style.text;el.style.border='2px solid '+o.style.border;el.style.borderRadius=o.style.radius+'px';el.textContent=o.label;}
  else if(o.type==='callout'){el.style.background=o.style.fill;el.style.color=o.style.text;el.style.border='2px solid '+o.style.border;el.style.borderRadius='10px';el.style.boxShadow='4px 4px 0 '+o.style.border;el.textContent=o.label;}
  else if(o.type==='dot'||o.type==='photo'||o.type==='note'||o.type==='num'){el.style.background=o.style.fill;el.style.color=o.style.text;el.style.border='2px solid '+o.style.border;el.style.borderRadius='50%';el.textContent=o.label;}
  else if(o.type==='line'){el.style.background=o.style.border;}
  else if(o.type==='dash'){el.style.background='transparent';el.style.borderTop='2px dashed '+o.style.border;}
  else if(o.type==='arrow'||o.type==='darrow'){el.style.background=o.style.border;el.style.color=o.style.border;}
}

function scaleStage(){
  var wrap=G('stagewrap'),stage=G('stage');
  var scale=wrap.offsetWidth/1002;
  stage.style.transform='scale('+scale+')';
  stage.style.width='1002px';
  wrap.style.height=(stage.offsetHeight*scale)+'px';
}

function pg(){return D.pages.find(function(p){return p.id===cid;})||D.pages[0];}

function renderPg(){
  var p=pg();
  G('ptitle').textContent=p.name;
  G('st').textContent=p.name;
  G('backbtn').style.display=p.id==='main'?'none':'';
  G('pimg').src=p.image||'';
  var layer=G('layer');layer.innerHTML='';
  (p.objects||[]).slice().sort(function(a,b){return(+((a.style||{}).z)||0)-(+((b.style||{}).z)||0);}).forEach(function(o){
    norm(o);if(o.hidden)return;
    var el=document.createElement('div');
    el.className='obj '+o.type;
    el.style.left=o.left;el.style.top=o.top;el.style.width=o.width;el.style.height=o.height;
    el.style.opacity=o.style.opacity;el.style.fontSize=o.style.font+'cqw';
    el.style.fontFamily=o.style.ff||'inherit';el.style.zIndex=o.style.z;
    el.style.transform='rotate('+(o.style.rotate||0)+'deg)';el.style.transformOrigin='left center';
    styleEl(el,o);
    el.onclick=function(){
      if(o.type==='zone'&&o.targetPage)goTo(o.targetPage);
      else openMod(o);
    };
    layer.appendChild(el);
  });
  G('pimg').onload=scaleStage;
  if(G('pimg').complete)scaleStage();
}

function goTo(id){cid=id;G('psel').value=id;history.replaceState(null,'','?page='+id);renderPg();}

// ── MODAL ────────────────────────────────────────────────────────────────────
function openMod(o){
  G('mt').textContent=o.label||o.type;
  G('mb').innerHTML='<div style="color:#484f58;font-size:13px;padding:12px 0">Chargement...</div>';
  G('mbg').classList.add('on');
  sync('ok','Synchronisé');

  if(!o.fields||!o.fields.length){
    G('mb').innerHTML='<div style="color:#484f58;font-style:italic;padding:12px 0">Aucun champ configuré.</div>';
    return;
  }

  loadObj(cid, o.id, function(saved){
    buildModal(o, saved);
  });
}

function buildModal(o, saved){
  var mb=G('mb');
  mb.innerHTML='';

  o.fields.forEach(function(f){
    var ui=f.ui||{};
    var savedVal=saved[f.id];
    var val=(savedVal!=null&&savedVal!=='')?savedVal:(f.value||'');

    var card=document.createElement('div');
    card.className='fcard';
    var accent=ui.accent||'#58a6ff';
    card.style.borderColor=accent+'44';

    // label
    var lbl=document.createElement('div');
    lbl.className='fcard-lbl';
    if(ui.icon)lbl.innerHTML='<span class="fcard-icon">'+esc(ui.icon)+'</span>';
    lbl.innerHTML+='<span>'+esc(f.label||'Champ')+(ui.required?' <span class="fcard-req">*</span>':'')+'</span>';
    card.appendChild(lbl);

    // input element
    var inp;
    var isNote=(f.type==='note'||ui.multiline);
    var isPhoto=(f.type==='photo');
    var isCheck=(f.type==='checkbox');

    if(isNote){
      inp=document.createElement('textarea');
      inp.className='finput';
      inp.value=val;
      inp.placeholder=ui.placeholder||'';
    } else if(isCheck){
      inp=document.createElement('select');
      inp.className='finput';
      inp.innerHTML='<option value=""'+((!val)?' selected':'')+'>—</option><option value="oui"'+(val==='oui'?' selected':'')+'>Oui</option><option value="non"'+(val==='non'?' selected':'')+'>Non</option>';
    } else {
      inp=document.createElement('input');
      inp.className='finput';
      inp.value=val;
      inp.placeholder=ui.placeholder||'';
      if(f.type==='number'||f.type==='dimension')inp.inputMode='decimal';
    }

    card.appendChild(inp);

    // unit
    if(ui.unit){
      var u=document.createElement('div');u.className='funit';u.textContent=ui.unit;card.appendChild(u);
    }

    // photo preview
    if(isPhoto&&val){
      if(/\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(val)){
        var img=document.createElement('img');img.className='fphoto';img.src=val;card.appendChild(img);
      } else {
        var a=document.createElement('a');a.className='flink';a.href=val;a.target='_blank';a.textContent=val;card.appendChild(a);
      }
    }

    mb.appendChild(card);

    // wire save
    var dbt=null;
    function doSave(){
      var v=inp.value||'';
      f.value=v;
      saveField(cid,o.id,f.id,v);
      // update photo preview live
      if(isPhoto){
        var existing=card.querySelector('.fphoto,.flink');
        if(existing)existing.remove();
        if(v){
          if(/\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(v)){
            var pi=document.createElement('img');pi.className='fphoto';pi.src=v;card.appendChild(pi);
          } else {
            var al=document.createElement('a');al.className='flink';al.href=v;al.target='_blank';al.textContent=v;card.appendChild(al);
          }
        }
      }
    }
    inp.addEventListener('input',function(){sync('saving','Frappe...');clearTimeout(dbt);dbt=setTimeout(doSave,800);});
    inp.addEventListener('change',doSave);
    inp.addEventListener('blur',function(){clearTimeout(dbt);doSave();});
  });
}

G('mclose').onclick=function(){G('mbg').classList.remove('on');};
G('mbg').addEventListener('click',function(e){if(e.target===G('mbg'))G('mbg').classList.remove('on');});

// ── INIT ─────────────────────────────────────────────────────────────────────
function init(){
  var sv=new URLSearchParams(location.search).get('page');
  if(sv&&D.pages.find(function(p){return p.id===sv;}))cid=sv;
  G('psel').innerHTML=D.pages.map(function(p){return'<option value="'+p.id+'">'+esc(p.name)+'</option>';}).join('');
  G('psel').value=cid;
  G('psel').onchange=function(){goTo(G('psel').value);};
  G('backbtn').onclick=function(){goTo('main');};
  window.addEventListener('resize',scaleStage);
  if(!navigator.onLine)G('offbar').classList.add('on');
  renderPg();
}

init();
</script>
</body></html>
